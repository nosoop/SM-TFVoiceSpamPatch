name: Build Workflow

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  run:
    name: Run action
    runs-on: ubuntu-latest

    # skip build on '[ci skip]'
    if: "!contains(github.event.head_commit.message, '[ci skip]')"

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Setup SourcePawn Compiler
      uses: rumblefrog/setup-sp@v1.3.1
      with:
        version: "1.10.x"
        no-spcomp-proxy: true

    - name: Setup Ninja Build
      uses: ashutoshvarma/setup-ninja@master
      with:
        version: 1.10.0

    - name: Build Files
      run: |
        python3 configure.py
        ninja

    - name: Build Package
      # the package generation should probably be part of the ninja script itself
      run: |
        pushd build
        zip -r package.zip scripting/ plugins/ gamedata/
        popd

    - name: Set Commit Hash
      id: commit_info
      run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: r${{ github.run_number }}
        release_name: Build ${{ steps.commit_info.outputs.sha_short  }}
        draft: false
        prerelease: false

    - name: Upload Release Asset
      id: upload-release-asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./build/package.zip
        asset_name: package.zip
        asset_content_type: application/zip
